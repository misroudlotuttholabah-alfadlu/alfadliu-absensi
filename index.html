<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL-FADLU ABSENSI - Login</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#07552e,#15915a);min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:white;width:min(400px,100%);padding:30px;border-radius:20px;box-shadow:0 15px 45px #0005;text-align:center}
.logo{width:90px;height:90px}.muted{color:#718078}.field{text-align:left;margin:14px 0}.field label{display:block;font-weight:bold;margin-bottom:6px}
input{width:100%;padding:12px;border:1px solid #ccd8d1;border-radius:9px;font-size:16px;box-sizing:border-box}
button{width:100%;padding:12px;border:0;border-radius:9px;background:#07552e;color:white;font-size:16px;font-weight:bold;cursor:pointer}
#msg{margin-top:15px;padding:10px;border-radius:8px;display:none}.ok{background:#e8f7ed;color:#07552e}.err{background:#ffeded;color:#a11}
#home{display:none}
</style>
</head>
<body>
<div id="loginBox" class="box">
<div class="logo" style="margin:auto;border-radius:50%;background:#07552e;color:#b9ee6b;display:grid;place-items:center;font-weight:bold;font-size:18px">AL-FADLU</div>
<h1>AL-FADLU ABSENSI</h1>
<div class="muted">Login Guru / Administrator</div>
<div class="field"><label>Username</label><input id="username"></div>
<div class="field"><label>Password</label><input id="password" type="password"></div>
<button id="loginButton" type="button">LOGIN</button>
<div id="msg"></div>
<p style="font-size:12px;color:#888">Admin: admin / admin123<br>Guru: guru / guru123</p>
</div>
<div id="home" class="box">
<h1>LOGIN BERHASIL ✅</h1><p id="welcome"></p>
<button type="button" onclick="location.reload()">Keluar</button>
</div>
<script>
(function(){
var btn=document.getElementById('loginButton');
var user=document.getElementById('username');
var pass=document.getElementById('password');
var msg=document.getElementById('msg');
function login(){
 var u=user.value.trim(),p=pass.value;
 msg.style.display='block';
 if((u==='admin'&&p==='admin123')||(u==='guru'&&p==='guru123')){
  msg.className='ok';msg.textContent='Login berhasil!';
  document.getElementById('loginBox').style.display='none';
  document.getElementById('home').style.display='block';
  document.getElementById('welcome').textContent='Selamat datang, '+(u==='admin'?'Administrator':'Guru')+'.';
 }else{msg.className='err';msg.textContent='Username atau password salah.';}
}
btn.addEventListener('click',login);
pass.addEventListener('keydown',function(e){if(e.key==='Enter')login();});
})();
</script>
</body>
</html>
