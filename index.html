<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AL-FADLU ABSENSI</title>
<style>
:root{--g:#0d6335;--g2:#084b28;--bg:#f4f7f5;--line:#dfe8e2}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#183226}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#084b28,#18804a)}.loginbox{background:#fff;width:min(420px,100%);padding:28px;border-radius:22px;box-shadow:0 15px 50px #0005;text-align:center}.logo{width:90px;height:90px;object-fit:contain}.brand{font-size:28px;font-weight:800;margin:8px}.muted{color:#718078}.field{margin:12px 0;text-align:left}.field label{font-weight:700;display:block;margin-bottom:5px}input,select{width:100%;padding:10px 12px;border:1px solid #ccd9d1;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700}.primary{background:var(--g);color:#fff}.secondary{background:#e8f3ec;color:var(--g2)}.danger{background:#feeceb;color:#a21b16}.gold{background:#fff3d3;color:#74580b}
.layout{min-height:100vh;display:flex}.side{position:fixed;left:0;top:0;bottom:0;width:245px;background:var(--g2);color:white;padding:16px;overflow:auto}.sidebrand{display:flex;align-items:center;gap:9px;margin-bottom:20px}.sidebrand img{width:45px;height:45px;background:#fff;border-radius:50%;object-fit:contain}.nav button{display:block;width:100%;text-align:left;color:#dceee3;background:transparent;border:0;border-radius:9px;padding:11px;margin:3px 0}.nav button:hover,.nav button.active{background:#ffffff1b;color:#fff}.main{margin-left:245px;flex:1;padding:20px;max-width:1600px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.top h1{margin:0;font-size:24px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:16px;box-shadow:0 3px 14px #12351d0c}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:16px;border-radius:13px;background:#edf8f1;border:1px solid #d9eadf}.stat b{display:block;font-size:29px;color:var(--g);margin-top:4px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input,.toolbar select{width:auto}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e8eeea;text-align:left;white-space:nowrap}th{background:#f1f6f3}.badge{display:inline-block;padding:4px 8px;border-radius:15px;background:#e8f5ed;color:#17643b;font-size:12px;font-weight:700}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.scanner{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.reader{min-height:300px;border:2px dashed #b8d2c2;border-radius:14px;display:grid;place-items:center;background:#f7fbf8}.alert{padding:11px;border-radius:9px;background:#fff8e5;border:1px solid #f0dfa9}.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center;padding:15px;z-index:10}.modalbox{background:#fff;border-radius:16px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto}.foot{text-align:center;color:#84938c;font-size:12px;padding:18px}
@media(max-width:900px){.side{width:72px;padding:9px}.sidebrand b,.nav span{display:none}.sidebrand{justify-content:center}.main{margin-left:72px}.grid{grid-template-columns:1fr 1fr}.scanner{grid-template-columns:1fr}}
@media(max-width:600px){.main{padding:11px}.top{flex-direction:column;align-items:flex-start;gap:8px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
@media print{.side,.top,.toolbar,.no-print{display:none!important}.main{margin:0}.card{border:0;box-shadow:none}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox">
<img id="loginLogo" class="logo"><div class="brand">AL-FADLU ABSENSI</div><div class="muted">Sistem Absensi MI – MTs – MA</div>
<div class="field"><label>Username</label><input id="lu" placeholder="Username"></div>
<div class="field"><label>Password</label><input id="lp" type="password" placeholder="Password"></div>
<button class="btn primary" style="width:100%" onclick="doLogin()">Masuk</button>
<p class="muted" style="font-size:12px">Demo Admin: admin / admin123<br>Demo Guru: guru / guru123</p>
</div></div>
<div id="app" class="hidden"><div class="layout">
<aside class="side"><div class="sidebrand"><img id="sideLogo"><b>AL-FADLU<br>ABSENSI</b></div>
<div class="nav">
<button data-p="dashboard" onclick="page('dashboard')">🏠 <span>Dashboard</span></button>
<button data-p="gate" onclick="page('gate')">🚪 <span>Absen Gerbang</span></button>
<button data-p="lesson" onclick="page('lesson')">🕐 <span>Absen Pelajaran</span></button>
<button data-p="students" onclick="page('students')">👨‍🎓 <span>Data Siswa</span></button>
<button data-p="teachers" onclick="page('teachers')">👨‍🏫 <span>Data Guru</span></button>
<button data-p="schools" onclick="page('schools')">🏫 <span>Lembaga</span></button>
<button data-p="reports" onclick="page('reports')">📊 <span>Rekap</span></button>
<button data-p="backup" onclick="page('backup')">💾 <span>Backup & Template</span></button>
<button data-p="settings" onclick="page('settings')">⚙️ <span>Pengaturan</span></button>
<button onclick="logout()">🚪 <span>Keluar</span></button>
</div></aside>
<main class="main"><div class="top"><h1 id="title">Dashboard</h1><div><span id="inst" class="badge"></span> <span id="who"></span></div></div><div id="content"></div><div class="foot">AL-FADLU ABSENSI • Versi HTML • Data tersimpan di browser</div></main>
</div></div>
<div id="modal" class="modal hidden"><div id="mbox" class="modalbox"></div></div>
<script src="https://unpkg.com/html5-qrcode"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
const K='alfadlu_absensi_v5';
const seed={schools:[{id:'MI',name:'MI Roudlotut Tholabah',logo:''},{id:'MTs',name:'MTs Roudlotut Tholabah',logo:''},{id:'MA',name:'MAS Al-Fadlu',logo:''}],teachers:[{id:'G001',nip:'',name:'Guru Demo',user:'guru',pass:'guru123',schools:['MI','MTs','MA'],photo:''}],students:[{id:'S001',nis:'1001',name:'Siswa Contoh 1',school:'MI',cls:'6A',gender:'L',code:'S001',photo:''},{id:'S002',nis:'1002',name:'Siswa Contoh 2',school:'MTs',cls:'8A',gender:'P',code:'S002',photo:''},{id:'S003',nis:'1003',name:'Siswa Contoh 3',school:'MA',cls:'11A',gender:'L',code:'S003',photo:''}],att:[],settings:{name:'Yayasan Al-Fadlu Tulang Bawang',logo:''}};
let db=JSON.parse(localStorage.getItem(K)||'null')||seed, ses=null, qr=null; db.schools.forEach(s=>{if(!('logo' in s))s.logo=''});
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(K,JSON.stringify(db))}
function logo(){return db.settings.logo||'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="94" fill="#0d6335"/><circle cx="100" cy="100" r="72" fill="#b7ef6a"/><text x="100" y="96" text-anchor="middle" font-size="25" font-weight="bold" fill="#073b21">AL-FADLU</text><text x="100" y="126" text-anchor="middle" font-size="18" font-weight="bold" fill="#073b21">ABSENSI</text></svg>')}
function doLogin(){let u=$('lu').value.trim(),p=$('lp').value;if(u==='admin'&&p==='admin123')ses={role:'admin',name:'Administrator',schools:['MI','MTs','MA']};else{let t=db.teachers.find(x=>x.user===u&&x.pass===p);if(t)ses={role:'guru',name:t.name,id:t.id,schools:t.schools}}if(!ses)return alert('Username/password salah.');localStorage.setItem('alfadlu_session',JSON.stringify(ses));start()}
function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=ses.name+' ('+ses.role+')';$('inst').textContent=ses.schools.length>1?'MI • MTs • MA':ses.schools[0];$('loginLogo').src=$('sideLogo').src=logo();page('dashboard')}
function logout(){localStorage.removeItem('alfadlu_session');ses=null;location.reload()}
function page(p){stopQR();document.querySelectorAll('.nav button[data-p]').forEach(x=>x.classList.toggle('active',x.dataset.p===p));let t={dashboard:'Dashboard',gate:'Absen Gerbang',lesson:'Absen Pelajaran',students:'Data Siswa',teachers:'Data Guru',schools:'Lembaga',reports:'Rekap Absensi',backup:'Backup & Template',settings:'Pengaturan'};$('title').textContent=t[p];({dashboard,gate,lesson,students,teachers,schools,reports,backup,settings}[p])()}
function dashboard(){let d=today(),a=db.att.filter(x=>x.date===d),s=db.students.filter(x=>ses.schools.includes(x.school));$('content').innerHTML='<div class="grid"><div class="stat">👨‍🎓<b>'+s.length+'</b>Siswa</div><div class="stat">👨‍🏫<b>'+db.teachers.length+'</b>Guru</div><div class="stat">✅<b>'+a.filter(x=>x.status==='Hadir').length+'</b>Absensi Hari Ini</div><div class="stat">🏫<b>'+ses.schools.length+'</b>Lembaga</div></div><div class="card"><h3>Selamat datang di AL-FADLU ABSENSI</h3><p>Satu akun guru dapat mengakses beberapa lembaga. Gunakan <b>Absen Gerbang</b> untuk semua siswa dan <b>Absen Pelajaran</b> untuk Jam 1–4.</p><div class="alert">Catatan: versi HTML ini menyimpan data di browser perangkat. Untuk database bersama antar perangkat, diperlukan backend/server.</div></div>'}
function gate(){$('content').innerHTML='<div class="card"><h3>🚪 Absen Barcode Gerbang</h3><p class="muted">Scan barcode siswa saat masuk gerbang.</p><div class="scanner"><div id="reader" class="reader">Memuat kamera...</div><div><div class="field"><label>Barcode manual</label><input id="manual" placeholder="S001"><button class="btn primary" style="margin-top:7px" onclick="record($('manual').value,'Gerbang')">Catat Absen</button></div><div id="result"></div><h4>Absensi hari ini</h4><div id="list"></div></div></div></div>';scan('gate');gateList()}
function scan(mode){if(!window.Html5Qrcode)return;setTimeout(()=>{try{qr=new Html5Qrcode('reader');qr.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},x=>record(x,mode==='gate'?'Gerbang':'Pelajaran'),()=>{}).catch(()=>{})}catch(e){}},100)}
function stopQR(){if(qr){qr.stop().catch(()=>{});qr.clear().catch(()=>{});qr=null}}
function today(){return new Date().toISOString().slice(0,10)}
function record(code,type){code=(code||'').trim();if(!code)return;let s=db.students.find(x=>x.code===code||x.id===code||x.nis===code);if(!s)return alert('Siswa tidak ditemukan.');if(!ses.schools.includes(s.school))return alert('Siswa bukan bagian dari lembaga yang dapat Anda akses.');let now=new Date(),time=now.toLocaleTimeString('id-ID'),period=type==='Pelajaran'?($('period')?.value||'1'):'';let du=db.att.find(x=>x.date===today()&&x.studentId===s.id&&x.type===type&&(!x.period||x.period===period));if(du)return alert(s.name+' sudah tercatat pada '+du.time);db.att.push({id:String(Date.now()),date:today(),time,studentId:s.id,school:s.school,cls:s.cls,status:'Hadir',type,period,subject:type==='Pelajaran'?($('subject')?.value||''):'',teacher:ses.name});save();if($('manual'))$('manual').value='';if(type==='Gerbang'){if($('result'))$('result').innerHTML='<div class="alert">✅ <b>'+esc(s.name)+'</b> • '+s.school+' • '+s.cls+'<br>'+time+'</div>';gateList()}else{if($('result'))$('result').innerHTML='<div class="alert">✅ '+esc(s.name)+' tercatat hadir.</div>';lessonList()}}
function gateList(){let el=$('list');if(!el)return;let r=db.att.filter(x=>x.date===today()&&x.type==='Gerbang').slice(-15).reverse();el.innerHTML=r.map(x=>{let s=db.students.find(y=>y.id===x.studentId);return '<div style="padding:7px;border-bottom:1px solid #eee">'+x.time+' — <b>'+esc(s?.name||'-')+'</b> <span class="badge">'+x.school+'</span></div>'}).join('')||'<span class="muted">Belum ada data.</span>'}
let activePeriod='1';
function lesson(){$('content').innerHTML='<div class="card"><h3>🕐 Absen Pelajaran — Kamera Jam 1–4</h3><p class="muted">Pilih jam, lalu scan barcode siswa menggunakan kamera HP.</p><div class="toolbar">'+['1','2','3','4'].map(p=>'<button class="btn '+(p===activePeriod?'primary':'secondary')+'" onclick="selectPeriod(\\''+p+'\\')">Jam '+p+'</button>').join('')+'</div><div class="formgrid"><div class="field"><label>Lembaga</label><select id="ll">'+ses.schools.map(x=>'<option>'+x+'</option>').join('')+'</select></div><div class="field"><label>Mata Pelajaran</label><input id="subject" placeholder="Isi manual"></div><div class="field"><label>Kelas</label><input id="lclass" placeholder="Opsional"></div></div><div class="scanner"><div id="readerLesson" class="reader">Memuat kamera untuk Jam '+activePeriod+'...</div><div><div class="field"><label>Barcode manual</label><input id="manual" placeholder="S001"><button class="btn primary" style="margin-top:7px" onclick="recordLesson($(\\'manual\\').value)">Catat Hadir</button></div><div id="result"></div><div id="list"></div></div></div></div>';startLessonCamera();lessonList()}
function selectPeriod(p){activePeriod=p;stopQR();lesson()}
function startLessonCamera(){if(!window.Html5Qrcode)return;setTimeout(()=>{try{qr=new Html5Qrcode('readerLesson');qr.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},code=>recordLesson(code),()=>{}).catch(()=>{$('readerLesson').innerHTML='📷 Kamera tidak dapat diakses. Izinkan kamera atau gunakan input barcode manual.'})}catch(e){$('readerLesson').innerHTML='📷 Scanner tidak tersedia.'}},100)}
function recordLesson(code){code=(code||'').trim();if(!code)return;let school=$('ll').value,subject=$('subject').value||'',s=db.students.find(x=>(x.code===code||x.id===code||x.nis===code)&&x.school===school);if(!s)return alert('Siswa tidak ditemukan pada lembaga '+school+'.');let du=db.att.find(x=>x.date===today()&&x.studentId===s.id&&x.type==='Pelajaran'&&x.period===activePeriod);if(du)return alert(s.name+' sudah hadir pada Jam '+activePeriod+'.');let now=new Date();db.att.push({id:String(Date.now()),date:today(),time:now.toLocaleTimeString('id-ID'),studentId:s.id,school:s.school,cls:s.cls,status:'Hadir',type:'Pelajaran',period:activePeriod,subject,teacher:ses.name});save();$('manual').value='';$('result').innerHTML='<div class="alert">✅ <b>'+esc(s.name)+'</b> • Jam '+activePeriod+' • '+esc(subject)+'</div>';lessonList()}
function lessonList(){let el=$('list');if(!el)return;let p=activePeriod,r=db.att.filter(x=>x.date===today()&&x.type==='Pelajaran'&&x.period===p).slice(-20).reverse();el.innerHTML=r.map(x=>{let s=db.students.find(y=>y.id===x.studentId);return '<div style="padding:7px;border-bottom:1px solid #eee">'+x.time+' — '+esc(s?.name||'-')+' <span class="badge">'+esc(x.subject||'-')+'</span></div>'}).join('')||'<span class="muted">Belum ada data.</span>'}
function students(){let r=db.students.filter(x=>ses.schools.includes(x.school));$('content').innerHTML='<div class="card"><div class="toolbar"><button class="btn primary" onclick="studentForm()">+ Tambah Siswa</button><button class="btn secondary" onclick="studentTemplate()">⬇ Template Siswa</button><label class="btn secondary">📥 Import CSV <input type="file" accept=".csv" style="display:none" onchange="importStudent(this.files[0])"></label><input id="sq" placeholder="Cari..." oninput="studentTable()"></div><div class="tablewrap"><table><thead><tr><th>NIS</th><th>Nama</th><th>Lembaga</th><th>Kelas</th><th>JK</th><th>Barcode</th><th>Aksi</th></tr></thead><tbody id="srows"></tbody></table></div></div>';studentTable()}
function studentTable(){let q=($('sq')?.value||'').toLowerCase(),r=db.students.filter(x=>ses.schools.includes(x.school)&&(`${x.name} ${x.nis} ${x.cls}`).toLowerCase().includes(q));$('srows').innerHTML=r.map(s=>'<tr><td>'+esc(s.nis)+'</td><td><b>'+esc(s.name)+'</b></td><td>'+s.school+'</td><td>'+esc(s.cls)+'</td><td>'+s.gender+'</td><td><span class="badge">'+esc(s.code)+'</span></td><td><button class="btn secondary" onclick="studentForm(\''+s.id+'\')">Edit</button> <button class="btn danger" onclick="delStudent(\''+s.id+'\')">Hapus</button> <button class="btn gold" onclick="showBarcode(\''+s.id+'\')">Barcode</button></td></tr>').join('')}
function studentForm(id=''){let s=db.students.find(x=>x.id===id)||{id:'',nis:'',name:'',school:ses.schools[0],cls:'',gender:'L',code:''};open('<h3>'+(id?'Edit':'Tambah')+' Siswa</h3><div class="formgrid"><div class="field"><label>NIS/NISN</label><input id="fn" value="'+esc(s.nis)+'"></div><div class="field"><label>Nama</label><input id="fna" value="'+esc(s.name)+'"></div><div class="field"><label>Lembaga</label><select id="fs">'+ses.schools.map(x=>'<option '+(x===s.school?'selected':'')+'>'+x+'</option>').join('')+'</select></div><div class="field"><label>Kelas</label><input id="fc" value="'+esc(s.cls)+'"></div><div class="field"><label>JK</label><select id="fg"><option '+(s.gender==='L'?'selected':'')+'>L</option><option '+(s.gender==='P'?'selected':'')+'>P</option></select></div><div class="field"><label>Barcode</label><input id="fcode" value="'+esc(s.code||s.id)+'"></div><div class="field full"><label>Foto siswa</label><input id="fphoto" type="file" accept="image/*"></div></div><p style="text-align:right"><button class="btn secondary" onclick="closeM()">Batal</button> <button class="btn primary" onclick="saveStudent(\''+id+'\')">Simpan</button></p>')}
function saveStudent(id){let old=db.students.find(x=>x.id===id),s=old||{id:'S'+Date.now()};Object.assign(s,{nis:$('fn').value,name:$('fna').value,school:$('fs').value,cls:$('fc').value,gender:$('fg').value,code:$('fcode').value||s.id});let f=$('fphoto').files[0];if(f){let r=new FileReader();r.onload=()=>{s.photo=r.result;finish()};r.readAsDataURL(f)}else finish();function finish(){if(!old)db.students.push(s);save();closeM();students()}}
function delStudent(id){if(confirm('Hapus siswa?')){db.students=db.students.filter(x=>x.id!==id);save();students()}}
function showBarcode(id){let s=db.students.find(x=>x.id===id);open('<h3>Barcode Siswa</h3><div style="text-align:center"><img src="'+schoolLogo(s.school)+'" style="width:70px;height:70px;object-fit:contain"><p><b>'+esc(s.name)+'</b><br>'+esc(s.nis)+' • '+esc(s.cls)+' • '+esc(s.code)+'</p><svg id="bc"></svg><p><button class="btn secondary" onclick="downloadBarcodeSVG()">⬇ Unduh SVG</button> <button class="btn primary" onclick="downloadBarcodePNG()">⬇ Unduh PNG</button> <button class="btn gold" onclick="print()">🖨 Cetak</button></p></div>');setTimeout(()=>{let el=$('bc');el.dataset.student=id;JsBarcode(el,s.code,{format:'CODE128',displayValue:true,width:2,height:80,margin:10})},50)}
function barcodeSvgText(){let el=$('bc');if(!el)return '';let x=el.cloneNode(true);x.setAttribute('xmlns','http://www.w3.org/2000/svg');return new XMLSerializer().serializeToString(x)}
function downloadBarcodeSVG(){download('barcode-siswa.svg','data:image/svg+xml;charset=utf-8,'+encodeURIComponent(barcodeSvgText()))}
function downloadBarcodePNG(){let u=URL.createObjectURL(new Blob([barcodeSvgText()],{type:'image/svg+xml'})),img=new Image();img.onload=()=>{let c=document.createElement('canvas');c.width=900;c.height=260;let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,50,60,800,120);URL.revokeObjectURL(u);download('barcode-siswa.png',c.toDataURL('image/png'))};img.src=u}
function teachers(){if(ses.role!=='admin'){return $('content').innerHTML='<div class="card"><h3>👨‍🏫 Data Guru</h3><p>Menu ini khusus Administrator.</p></div>'}$('content').innerHTML='<div class="card"><div class="toolbar"><button class="btn primary" onclick="teacherForm()">+ Tambah Guru</button><button class="btn secondary" onclick="teacherTemplate()">⬇ Template Guru</button><label class="btn secondary">📥 Import CSV <input type="file" accept=".csv" style="display:none" onchange="importTeacher(this.files[0])"></label></div><div class="tablewrap"><table><thead><tr><th>NIP</th><th>Nama</th><th>Username</th><th>Akses</th><th>Aksi</th></tr></thead><tbody>'+db.teachers.map(t=>'<tr><td>'+esc(t.nip)+'</td><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.user)+'</td><td>'+t.schools.map(x=>'<span class="badge">'+x+'</span>').join(' ')+'</td><td><button class="btn secondary" onclick="teacherForm(\''+t.id+'\')">Edit</button> <button class="btn danger" onclick="delTeacher(\''+t.id+'\')">Hapus</button></td></tr>').join('')+'</tbody></table></div></div>'}
function teacherForm(id=''){let t=db.teachers.find(x=>x.id===id)||{id:'',nip:'',name:'',user:'',pass:'',schools:['MI']};open('<h3>'+(id?'Edit':'Tambah')+' Guru</h3><div class="formgrid"><div class="field"><label>NIP</label><input id="tn" value="'+esc(t.nip)+'"></div><div class="field"><label>Nama</label><input id="tna" value="'+esc(t.name)+'"></div><div class="field"><label>Username</label><input id="tu" value="'+esc(t.user)+'"></div><div class="field"><label>Password</label><input id="tp" value="'+esc(t.pass)+'"></div><div class="field full"><label>Akses Lembaga</label>'+db.schools.map(i=>'<label style="display:inline-block;margin:5px 15px 5px 0"><input class="sc" type="checkbox" value="'+i.id+'" '+(t.schools.includes(i.id)?'checked':'')+'> '+i.id+'</label>').join('')+'</div></div><p style="text-align:right"><button class="btn secondary" onclick="closeM()">Batal</button> <button class="btn primary" onclick="saveTeacher(\''+id+'\')">Simpan</button></p>')}
function saveTeacher(id){let old=db.teachers.find(x=>x.id===id),t=old||{id:'G'+Date.now()};let schools=[...document.querySelectorAll('.sc:checked')].map(x=>x.value);if(!schools.length)return alert('Pilih minimal satu lembaga.');Object.assign(t,{nip:$('tn').value,name:$('tna').value,user:$('tu').value,pass:$('tp').value,schools});if(!old)db.teachers.push(t);save();closeM();teachers()}
function delTeacher(id){if(confirm('Hapus guru?')){db.teachers=db.teachers.filter(x=>x.id!==id);save();teachers()}}
function schoolLogo(id){let s=db.schools.find(x=>x.id===id);return s&&s.logo?s.logo:logo()}
function schools(){if(ses.role!=='admin')return $('content').innerHTML='<div class="card"><h3>🏫 Lembaga</h3><p>Menu ini khusus Administrator.</p></div>';$('content').innerHTML='<div class="card"><h3>🏫 Lembaga & Logo</h3><div class="grid">'+db.schools.map(s=>'<div class="card" style="margin:0;text-align:center"><img src="'+schoolLogo(s.id)+'" style="width:80px;height:80px;object-fit:contain"><h3>'+esc(s.id)+'</h3><div>'+esc(s.name)+'</div><br><button class="btn primary" onclick="schoolForm(\\''+s.id+'\\')">Edit & Upload Logo</button></div>').join('')+'</div></div>'}
function schoolForm(id){let s=db.schools.find(x=>x.id===id);open('<h3>Edit Lembaga '+esc(s.id)+'</h3><div class="field"><label>Nama Lembaga</label><input id="sn" value="'+esc(s.name)+'"></div><div class="field"><label>Logo Lembaga</label><input id="slogo" type="file" accept="image/*"></div><p style="text-align:right"><button class="btn secondary" onclick="closeM()">Batal</button> <button class="btn primary" onclick="saveSchool(\\''+id+'\\')">Simpan</button></p>')}
function saveSchool(id){let s=db.schools.find(x=>x.id===id);s.name=$('sn').value;let f=$('slogo').files[0];if(f){let r=new FileReader();r.onload=()=>{s.logo=r.result;save();closeM();schools()};r.readAsDataURL(f)}else{save();closeM();schools()}}
function reports(){$('content').innerHTML='<div class="card"><h3>📊 Rekap Absensi</h3><div class="toolbar"><input type="date" id="rd" value="'+today()+'"><select id="rl"><option value="">Semua lembaga</option>'+ses.schools.map(x=>'<option>'+x+'</option>').join('')+'</select><select id="rt"><option value="">Semua</option><option>Gerbang</option><option>Pelajaran</option></select><button class="btn primary" onclick="reportTable()">Tampilkan</button><button class="btn secondary" onclick="csv()">⬇ CSV</button><button class="btn gold" onclick="print()">🖨 PDF/Cetak</button></div><div class="tablewrap"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>NIS</th><th>Nama</th><th>Lembaga</th><th>Kelas</th><th>Jenis</th><th>Jam</th><th>Mapel</th><th>Status</th><th>Guru</th></tr></thead><tbody id="rr"></tbody></table></div></div>';reportTable()}
function rows(){return db.att.filter(a=>(!$('rd').value||a.date===$('rd').value)&&(!$('rl').value||a.school===$('rl').value)&&(!$('rt').value||a.type===$('rt').value)&&ses.schools.includes(a.school))}
function reportTable(){$('rr').innerHTML=rows().map(a=>{let s=db.students.find(x=>x.id===a.studentId);return '<tr><td>'+a.date+'</td><td>'+a.time+'</td><td>'+esc(s?.nis||'')+'</td><td>'+esc(s?.name||'')+'</td><td>'+a.school+'</td><td>'+esc(a.cls)+'</td><td>'+a.type+'</td><td>'+a.period+'</td><td>'+esc(a.subject)+'</td><td>'+a.status+'</td><td>'+esc(a.teacher)+'</td></tr>'}).join('')||'<tr><td colspan="11">Tidak ada data.</td></tr>'}
function csv(){let h=['Tanggal','Jam','NIS','Nama','Lembaga','Kelas','Jenis','Jam Ke','Mapel','Status','Guru'],r=rows().map(a=>{let s=db.students.find(x=>x.id===a.studentId);return[a.date,a.time,s?.nis||'',s?.name||'',a.school,a.cls,a.type,a.period,a.subject,a.status,a.teacher]});let txt=[h,...r].map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');download('rekap-absensi.csv','data:text/csv;charset=utf-8,'+encodeURIComponent(txt))}
function backup(){$('content').innerHTML='<div class="card"><h3>💾 Backup & Template</h3><p><button class="btn primary" onclick="download(\'backup-alfadlu.json\',\'data:application/json;charset=utf-8,\'+encodeURIComponent(JSON.stringify(db,null,2)))">⬇ Backup JSON</button> <label class="btn secondary">⬆ Restore JSON <input type="file" accept=".json" style="display:none" onchange="restore(this.files[0])"></label> <button class="btn danger" onclick="resetDB()">Reset Demo</button></p></div><div class="card"><h3>📥 Template</h3><button class="btn secondary" onclick="studentTemplate()">Template Siswa</button> <button class="btn secondary" onclick="teacherTemplate()">Template Guru</button><p class="muted">Siswa: nis,nama,lembaga,kelas,gender,barcode<br>Guru: nip,nama,username,password,lembaga (contoh MI|MTs)</p></div>'}
function studentTemplate(){download('template-siswa.csv','data:text/csv;charset=utf-8,'+encodeURIComponent('nis,nama,lembaga,kelas,gender,barcode\n1004,Nama Siswa,MI,1A,L,S1004\n'))}
function teacherTemplate(){download('template-guru.csv','data:text/csv;charset=utf-8,'+encodeURIComponent('nip,nama,username,password,lembaga\n,Contoh Guru,guru2,guru123,MI|MTs\n'))}
function parse(line){let a=[],c='',q=false;for(let x of line){if(x==='"')q=!q;else if(x===','&&!q){a.push(c);c=''}else c+=x}a.push(c);return a.map(x=>x.trim().replace(/^"|"$/g,''))}
function importStudent(f){if(!f)return;let r=new FileReader();r.onload=()=>{r.result.split(/\r?\n/).filter(Boolean).slice(1).forEach(l=>{let[a,b,c,d,e,f]=parse(l);if(b)db.students.push({id:'S'+Date.now()+Math.random(),nis:a,name:b,school:c,cls:d,gender:e||'L',code:f||a,photo:''})});save();students();alert('Import siswa selesai.');};r.readAsText(f)}
function importTeacher(f){if(!f)return;let r=new FileReader();r.onload=()=>{r.result.split(/\r?\n/).filter(Boolean).slice(1).forEach(l=>{let[a,b,c,d,e]=parse(l);if(b)db.teachers.push({id:'G'+Date.now()+Math.random(),nip:a,name:b,user:c,pass:d,schools:e.split('|').filter(Boolean),photo:''})});save();teachers();alert('Import guru selesai.');};r.readAsText(f)}
function settings(){$('content').innerHTML='<div class="card"><h3>⚙️ Pengaturan</h3><div class="field"><label>Nama Yayasan</label><input id="setname" value="'+esc(db.settings.name)+'"></div><div class="field"><label>Logo Utama Aplikasi</label><input id="setlogo" type="file" accept="image/*"></div><button class="btn primary" onclick="saveSettings()">Simpan</button></div><div class="card"><h3>🔐 Hak Akses</h3><p><b>Admin:</b> semua menu.</p><p><b>Guru:</b> absensi dan data siswa sesuai lembaga yang diberikan.</p></div>'}
function saveSettings(){db.settings.name=$('setname').value;let f=$('setlogo').files[0];if(f){let r=new FileReader();r.onload=()=>{db.settings.logo=r.result;save();$('loginLogo').src=$('sideLogo').src=r.result;alert('Tersimpan');settings()};r.readAsDataURL(f)}else{save();alert('Tersimpan')}}
function open(x){$('mbox').innerHTML=x;$('modal').classList.remove('hidden')}function closeM(){$('modal').classList.add('hidden')}function download(n,u){let a=document.createElement('a');a.href=u;a.download=n;a.click()}function restore(f){if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Restore berhasil');page('dashboard')}catch(e){alert('Backup tidak valid')}};r.readAsText(f)}function resetDB(){if(confirm('Reset semua data demo?')){db=JSON.parse(JSON.stringify(seed));save();page('dashboard')}}
$('modal').onclick=e=>{if(e.target.id==='modal')closeM()};
let old=localStorage.getItem('alfadlu_session');if(old){try{ses=JSON.parse(old);start()}catch(e){}}
$('loginLogo').src=logo();
</script>
</body>
</html>
